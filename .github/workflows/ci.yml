name: CI

on:
  push:
    branches: [main]
  pull_request:

# The ui-kit comes from GitHub Packages, which wants a token even to read. A Maven package there takes its
# access from its own repository (plusauri/ui-kit) and cannot grant another repo's job token, so CI reads it
# with a classic token that has only `read:packages`, kept as the PLUSAURI_PACKAGES_TOKEN secret.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUSAURI_PACKAGES_TOKEN: ${{ secrets.PLUSAURI_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :loquilis-model:jvmTest :loquilis-agents:jvmTest :loquilis-store:jvmTest :loquilis-views:jvmTest :app:jvmTest
      - name: Generated code matches the protos
        run: |
          ./gradlew :loquilis-model:generateCommonMainProtos
          git diff --exit-code -- loquilis-model/src/commonMain/kotlin/loquilis/model
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Schema lint
        run: buf lint
      - name: Schema breaking changes
        if: github.event_name == 'push'
        run: buf breaking --against '.git#ref=HEAD~1'
