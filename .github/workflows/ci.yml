name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :kit-model:jvmTest :kit-agents:jvmTest :kit-store:jvmTest :app:jvmTest
      - name: Generated code matches the protos
        run: |
          ./gradlew :kit-model:generateCommonMainProtos
          git diff --exit-code -- kit-model/src/commonMain/kotlin/loquilis/model
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Schema lint
        run: buf lint
      - name: Schema breaking changes
        if: github.event_name == 'push'
        run: buf breaking --against '.git#ref=HEAD~1'
